server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/medfis_db
spring.datasource.username=medfis_user
spring.datasource.password=medfis_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
jwt.secret=MedFis2024SecretKeyParaJWTMustBe256BitsLongAtLeast32Chars!
jwt.expiration=86400000
cors.allowed-origins=http://localhost:5173,http://localhost:3000
logging.level.com.medfis=DEBUG

# ── CORREO Gmail SMTP ──────────────────────────────────────────────────────────
# IMPORTANTE: usar App Password de Google, NO la contraseña normal
# myaccount.google.com → Seguridad → Verificación en 2 pasos (activar)
# → Contraseñas de aplicación → "Correo" → "Windows/Mac" → Generar (16 chars)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=medfissaludintensa@gmail.com
spring.mail.password=${MEDFIS_MAIL_PASSWORD:REEMPLAZAR_CON_APP_PASSWORD_16_CHARS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

