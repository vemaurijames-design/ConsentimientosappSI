# =========== SERVIDOR ===========
# 8080: es el puerto que usan Postman y el frontend. NO lo cambies a 8081.
server.port=8080

# =========== BASE DE DATOS ===========
spring.datasource.url=jdbc:postgresql://localhost:5432/medfis_db
spring.datasource.username=${MEDFIS_DB_USER:medfis_user}
spring.datasource.password=${MEDFIS_DB_PASSWORD:medfis_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false


# =========== SEGURIDAD ===========
jwt.secret=${MEDFIS_JWT_SECRET:MedFis2024SecretKeyParaJWTMustBe256BitsLongAtLeast32Chars!}
jwt.expiration=86400000
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:4200

# =========== ADMINISTRADOR UNICO (acceso total) ===========
medfis.admin.email=${MEDFIS_ADMIN_EMAIL:mantenimientojms@hotmail.com}
medfis.admin.password=${MEDFIS_ADMIN_PASSWORD:admin123456}
medfis.admin.nombre=Administrador Salud Intensa
medfis.admin.reset-password=true

# =========== LOGS ===========
logging.level.com.medfis=DEBUG
logging.level.org.springframework.mail=DEBUG

# =========== FECHAS ISO-8601 ===========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=America/Bogota

