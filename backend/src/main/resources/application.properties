server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/medfis_db
spring.datasource.username=medfis_user
spring.datasource.password=medfis_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
jwt.secret=MedFis2024SecretKeyParaJWTMustBe256BitsLongAtLeast32Chars!
jwt.expiration=86400000
cors.allowed-origins=http://localhost:5173,http://localhost:3000
logging.level.com.medfis=DEBUG

# ── Serialización de fechas como ISO-8601 (no como array) ─────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=America/Bogota

# ── CORREO Hotmail/Outlook SMTP ───────────────────────────────────────────────
# Cuenta: saludintensaconsentimientos@hotmail.com
# Contraseña: la contraseña normal de la cuenta Hotmail
# Si tienes verificación en 2 pasos activada en Hotmail:
#   account.live.com → Seguridad → Contraseñas de aplicación → Crear nueva
spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=${MEDFIS_MAIL_USER:saludintensaconsentimientos@hotmail.com}
spring.mail.password=${MEDFIS_MAIL_PASSWORD:TU_CLAVE_HOTMAIL_AQUI}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Datos del remitente
medfis.mail.from=${MEDFIS_MAIL_USER:saludintensaconsentimientos@hotmail.com}
medfis.mail.from-name=Salud Intensa Med y Fis IPS - Consentimientos
medfis.mail.copy-to=${MEDFIS_MAIL_COPY:mantenimientojms@hotmail.com}
medfis.whatsapp.clinica=${MEDFIS_WA_CLINICA:573114048112}

# Número WhatsApp del administrador (recibe solicitudes de acceso desde el login)
medfis.wa.admin=${MEDFIS_WA_ADMIN:573114048112}

# Nombre de la IPS para los mensajes de WhatsApp
medfis.nombre-ips=${MEDFIS_NOMBRE_IPS:Salud Intensa Med y Fis IPS}
